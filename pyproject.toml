[project]
name = "lbs-liner"
version = "0.1.0"
description = "Служебный конвертер для CorelDRAW: залитая область в CDR-файле превращается в двойную двухцветную контурную линию"
readme = "README.md"
authors = [
    {name = "Vladimir Kirievskiy", email = "vlakir1234@gmail.com"},
]
requires-python = ">=3.14"
dependencies = [
    "shapely>=2.1.2",
]
[dependency-groups]
dev = [
    "ruff>=0.12.10",
    "mypy>=1.17.1",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
]
build = [
    "pyinstaller>=6.11",
]


[tool.ruff]
unsafe-fixes = true
line-length = 88
indent-width = 4
target-version = "py314"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "build",
    "dist",
    "tests",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1", "D203", "D212",
    "BLE001", "ANN002", "ANN204",
    "RUF001", "COM812", "RUF002",
    "RUF003", "G004", "PLR0912",
    "PLR0913", "D401", "PLR0915",
    "C901", "D205", "N802",
    "CPY001",
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
mypy_path = "src"


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
# Coverage is intentionally NOT in the default addopts: the coverage tracer's
# accumulating data noticeably inflates a full run's peak RSS, so the default
# `pytest` stays light for repeated local iteration (important when several git
# worktrees share one machine — see CLAUDE.md → heavy-run mutex). The ≥80%
# threshold is still enforced, just as an explicit command in the pre-push gate
# and CI (run through the mutex wrapper):
#   scripts/pytest-guard.sh --cov=src --cov-report=term-missing --cov-fail-under=80
addopts = "-q --tb=short"
testpaths = ["tests"]


[tool.coverage.run]
source = ["src"]
branch = true


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
